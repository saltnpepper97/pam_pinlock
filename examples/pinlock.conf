# pinlock configuration file
# Place this file at /etc/pinlock.conf or ~/.pinlock/pinlock.conf

# PIN storage directory
# Leave empty to use ~/.pinlock for each user.
# Global pin_dir affects every PAM service. On mixed desktop systems, prefer
# setting pin_dir=/var/lib/pinlock on sudo/polkit PAM lines instead.
# Root/helper services can use an absolute root-managed shared directory:
# pin_dir=/var/lib/pinlock

# User configuration overrides
# Disabled by default so ~/.pinlock/pinlock.conf cannot weaken system policy.
allow_user_config=no

# PIN requirements
min_length=6
max_length=32
require_digits_only=yes

# Rate limiting (attempts per time window)
max_attempts=5
lockout_window=300    # 5 minutes in seconds
rate_limit_window=60  # 1 minute in seconds

# Account lockout (disabled by default)
enable_lockout=no
lockout_duration=900  # 15 minutes in seconds
# By default lockout only skips PIN and falls back to the next PAM method.
# Set yes to return PAM_AUTH_ERR during PIN lockout.
lockout_fails_auth=no

# Logging
log_attempts=yes
log_success=yes
log_failures=yes

# Debug mode
debug=no
